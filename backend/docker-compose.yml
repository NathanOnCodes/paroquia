# Compose de desenvolvimento e homologação.
#
#   docker compose up --build
#
# A API aplica as migrations na subida e fica em http://localhost:8080.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paroquia
      POSTGRES_PASSWORD: paroquia
      POSTGRES_DB: paroquia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paroquia -d paroquia"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
      args:
        VERSAO: ${VERSAO:-dev}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATABASE_URL: postgres://paroquia:paroquia@db:5432/paroquia?sslmode=disable
      DATABASE_AUTO_MIGRATE: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-troque-este-segredo-por-um-valor-aleatorio-de-32-bytes}
      STORAGE_DIR: /app/data
      CHAVE_API_RESEND: ${CHAVE_API_RESEND:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Paróquia <nao-responder@paroquia.local>}
      EMAIL_NOTIFICACAO_ADMIN: ${EMAIL_NOTIFICACAO_ADMIN:-}
      CHAVE_SECRETA_STRIPE: ${CHAVE_SECRETA_STRIPE:-}
      SEGREDO_WEBHOOK_STRIPE: ${SEGREDO_WEBHOOK_STRIPE:-}
      NEXT_PUBLIC_CHAVE_PUBLICA_STRIPE: ${NEXT_PUBLIC_CHAVE_PUBLICA_STRIPE:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/data

volumes:
  pgdata:
  uploads:
